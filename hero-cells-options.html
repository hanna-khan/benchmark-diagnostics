<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero cell options | Benchmark Diagnostics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap">
<style>
:root{--ink:#071433;--navy:#0a1f55;--brand-soft:#5b86e8;--on-dark:#c7d3ef;--font:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:#fff;font-family:var(--font);overflow-x:hidden}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:7rem clamp(1.25rem,6vw,5rem) clamp(5rem,12vh,8rem);isolation:isolate;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.kicker{display:flex;align-items:center;gap:.7rem;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-soft)}
.kicker::before{content:"";width:1.4rem;height:1px;background:currentColor}
h1{margin-top:1.1rem;font-weight:300;font-size:clamp(2.4rem,6vw,5.2rem);line-height:1.04;letter-spacing:-.04em}
.lead{max-width:46ch;margin-top:1.5rem;color:var(--on-dark);font-size:clamp(1rem,1.4vw,1.2rem);line-height:1.6}
.acts{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap}
.pill{padding:.95rem 1.6rem;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink);background:#fff}
.pill.g{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3)}
.bar{position:fixed;z-index:10;top:1rem;left:50%;transform:translateX(-50%);display:flex;gap:.35rem;padding:.35rem;border-radius:999px;background:rgba(7,20,51,.7);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);max-width:calc(100vw - 1.5rem)}
.bar button{border:0;border-radius:999px;padding:.65rem 1.1rem;background:transparent;color:var(--on-dark);font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:background .3s,color .3s}
.bar button[aria-pressed=true]{background:#fff;color:var(--ink)}
.note{position:fixed;z-index:10;right:1.25rem;bottom:1.25rem;max-width:21rem;padding:1rem 1.15rem;border-radius:18px;background:rgba(7,20,51,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);font-size:.88rem;line-height:1.55;color:var(--on-dark)}
.note b{display:block;margin-bottom:.25rem;color:#fff;font-size:1rem;font-weight:600}
.tag{display:inline-block;margin-bottom:.5rem;padding:.2rem .6rem;border-radius:999px;background:#5b86e8;color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:700px){.note{left:.75rem;right:.75rem;bottom:.75rem;max-width:none;font-size:.8rem}.bar button{padding:.6rem .8rem;font-size:.8rem}}
</style>
</head>
<body>
<div class="bar" role="group" aria-label="Hero options">
  <button type="button" data-m="0" aria-pressed="true">A · Fine Tissue</button>
  <button type="button" data-m="1" aria-pressed="false">B · Magnified Culture</button>
  <button type="button" data-m="2" aria-pressed="false">C · Living Network</button>
</div>
<aside class="note" id="note"></aside>
<section class="hero">
  <canvas id="c" aria-hidden="true"></canvas>
  <p class="kicker">Diagnostic pathology expertise</p>
  <h1>Precision Diagnostics.<br>Personalized Service.</h1>
  <p class="lead">Specialized pathology services providing physicians with timely, reliable, and clinically meaningful diagnoses to support confident decisions and better patient care.</p>
  <div class="acts"><a class="pill" href="#">Explore Our Services</a><a class="pill g" href="#">Educational Resources</a></div>
</section>
<script>
const NOTES=[
 ["A · Fine Tissue","Recommended","Same lens idea you like, but the tissue is now fine-grained: tiny cells with chromatin texture and nucleoli. The lens magnifies a little, cells slowly drift, and the tissue ripples gently around your cursor."],
 ["B · Magnified Culture","Most realistic","Outside the lens you see a faint, tiny cell field with drifting red blood cells (with depth). Inside the lens the view is magnified ×2.6 and cells look like real H&E: granular cytoplasm, nuclear membrane, nucleolus."],
 ["C · Living Network","Most animated","No lens. The whole hero is a field of tiny glowing cells. Pulses travel through the network and cells near your cursor flush from blue to eosin pink. Lightest on the GPU, very smooth on mobile."]
];
const FRAG=`precision highp float;
uniform vec2 uR,uM;uniform float uT,uMode;
float h1(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h1(i),h1(i+vec2(1,0)),f.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){return .5*vn(p)+.25*vn(p*2.03+7.1)+.125*vn(p*4.1+3.7);}
vec3 vor(vec2 p,float t){vec2 g=floor(p),f=fract(p);float d1=8.,d2=8.;vec2 id=vec2(0.);
 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 o=vec2(float(i),float(j));vec2 r=h2(g+o);
  r=.5+.36*sin(t+6.2831*r);vec2 v=o+r-f;float d=dot(v,v);
  if(d<d1){d2=d1;d1=d;id=g+o;}else if(d<d2){d2=d;}}
 return vec3(sqrt(d1),sqrt(d2),h1(id));}
// realistic H&E cell: returns colour. v=vor result, q=sample pos (for texture)
vec3 he(vec3 v,vec2 q,float detail){
 float edge=smoothstep(.0,.075,v.y-v.x);
 float gran=fbm(q*detail);
 float nr=.30+.05*v.z;
 float nuc=smoothstep(nr,nr-.07,v.x);
 vec3 eos=mix(vec3(.60,.22,.40),vec3(.95,.60,.74),v.z);
 vec3 cyt=eos*(.45+.55*edge)*(.82+.36*gran);
 vec3 hem=vec3(.17,.14,.44)*(.7+.6*fbm(q*detail*1.7));
 vec3 c=mix(cyt,hem,nuc*.92);
 c+=vec3(.55,.55,.95)*smoothstep(nr-.02,nr-.07,v.x)*(1.-smoothstep(nr-.07,nr-.13,v.x))*.18; // nuclear membrane
 c*=1.-.55*smoothstep(.07,.02,v.x)*nuc;   // nucleolus
 c+=vec3(.9,.8,1.)*smoothstep(.10,.0,v.x)*nuc*.05;
 return c;}
void main(){
 vec2 uv=gl_FragCoord.xy/uR;float asp=uR.x/uR.y;
 vec2 p=(uv-.5)*vec2(asp,1.),m=(uM-.5)*vec2(asp,1.);
 float t=uT;
 vec3 navy=vec3(.027,.078,.20);
 vec3 col=navy;
 float fadeL=mix(.40,1.,smoothstep(.12,.85,uv.x));
 if(uMode<.5){            // A: fine tissue + gentle ripple
  vec2 d=p-m;float rr=dot(d,d);float f=exp(-rr*55.);
  vec2 pw=p+vec2(-d.y,d.x)*f*.35*sin(t*1.6)+vec2(.004*sin(p.y*30.+t*.7),.004*cos(p.x*30.+t*.6));
  float R=.15;float dl=length(p-m);float lens=smoothstep(R,R-.02,dl);
  vec2 q=mix(pw,m+(pw-m)*.5,lens);
  float sc=26.;vec3 v=vor(q*sc,t*.16);
  float edge=smoothstep(.0,.08,v.y-v.x);float nuc=smoothstep(.32,.24,v.x);
  vec3 bg=navy+vec3(.04,.10,.22)*(1.-edge)*.9+vec3(.03,.07,.17)*nuc;
  bg+=vec3(.25,.45,.9)*(1.-edge)*.05;
  col=mix(bg,he(v,q*sc,5.),lens);
  col+=vec3(.36,.53,.91)*smoothstep(.006,.0,abs(dl-R))*.8;
  col+=vec3(.55,.75,1.)*smoothstep(R,R-.05,dl)*smoothstep(R-.05,R,dl+.0)*.0;
  col*=fadeL;
 } else if(uMode<1.5){    // B: magnified culture + floating RBC
  float R=.17;float dl=length(p-m);float lens=smoothstep(R,R-.02,dl);
  vec2 drift=vec2(t*.004,-t*.003);
  float sc=34.;vec3 vo=vor((p+drift)*sc,t*.14);
  float eo=smoothstep(.0,.08,vo.y-vo.x);float no=smoothstep(.30,.22,vo.x);
  vec3 bg=navy+vec3(.035,.085,.19)*(1.-eo)+vec3(.02,.05,.12)*no;
  // RBC layer with parallax (outside)
  for(int k=0;k<2;k++){float s=k==0?7.:11.;vec2 gp=p*s+vec2(t*(k==0?.07:.11),t*.03*float(k+1));vec2 g=floor(gp),f=fract(gp);vec2 c=.5+.28*sin(t*.3+6.28*h2(g));float d=length(f-c);
   float ring=smoothstep(.27,.22,d)-smoothstep(.14,.06,d)*.7;float on=step(.55,h1(g+float(k)*9.));
   bg+=vec3(.80,.28,.40)*ring*on*(k==0?.10:.06);}
  vec2 q=m+(p-m)*.385;
  vec3 v=vor(q*sc*.62+vec2(t*.01),t*.2);
  vec3 cell=he(v,q*sc*.62,7.);
  // RBC inside lens
  vec2 gp=q*9.+vec2(t*.05,t*.02);vec2 g=floor(gp),f=fract(gp);vec2 c=.5+.2*sin(t*.4+6.28*h2(g));float d=length(f-c);
  float ring=smoothstep(.26,.22,d)-smoothstep(.13,.05,d)*.7;cell=mix(cell,vec3(.85,.30,.42),ring*step(.7,h1(g))*.85);
  cell*=1.-.35*smoothstep(R*.55,R,dl);      // lens vignette
  col=mix(bg,cell,lens);
  col+=vec3(.36,.53,.91)*smoothstep(.007,.0,abs(dl-R))*.9;
  col+=vec3(.7,.85,1.)*smoothstep(.01,.0,abs(length(p-m-vec2(-.045,.05))-.05))*.0;
  col+=vec3(.8,.9,1.)*smoothstep(.06,.0,length(p-m-vec2(-.07,.08)))*lens*.07;
  col*=fadeL;
 } else {                  // C: living network
  float sc=22.;vec2 pp=p+vec2(t*.006,0.);vec3 v=vor(pp*sc,t*.2);
  float edge=smoothstep(.0,.07,v.y-v.x);float nuc=smoothstep(.30,.20,v.x);
  float dm=length(p-m);
  float wave=sin(dm*22.-t*2.6)*exp(-dm*2.4);
  float pulse=.5+.5*sin(t*.9+v.z*40.);
  float near=exp(-dm*dm*34.);
  vec3 line=vec3(.20,.42,.88)*(1.-edge)*(.10+.12*pulse+.20*max(wave,0.));
  vec3 core=mix(vec3(.18,.32,.78),vec3(.95,.55,.72),near)*nuc*(.14+.20*pulse+.55*max(wave,0.)+.6*near);
  vec3 body=mix(vec3(.02,.06,.16),vec3(.45,.17,.33),near)*(1.-nuc)*edge*(.25+.9*near);
  col=navy+line+core+body;
  col+=vec3(.9,.95,1.)*smoothstep(.10,.0,v.x)*nuc*near*.25;
  col*=fadeL*(1.+.2*near);
 }
 col*=1.-.5*dot(uv-.5,uv-.5);
 gl_FragColor=vec4(col,1.);}`;
const cv=document.getElementById('c');const gl=cv.getContext('webgl',{antialias:false,alpha:false});
const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);const uR=U('uR'),uM=U('uM'),uT=U('uT'),uMode=U('uMode');
let mode=+(new URLSearchParams(location.search).get('m')||0),mx=.78,my=.55,tx=mx,ty=my,lastP=-1e9;const t0=performance.now();
const small=innerWidth<760;
function size(){const d=Math.min(devicePixelRatio||1,small?1:1.25)*(small?.8:1);cv.width=Math.round(innerWidth*d);cv.height=Math.round(cv.parentNode.clientHeight*d);gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(uR,cv.width,cv.height)}
size();addEventListener('resize',size);
document.querySelector('.hero').addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width;ty=1-(e.clientY-r.top)/r.height;lastP=performance.now()});
function setMode(m){mode=m;document.querySelectorAll('.bar button').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.m===m)));const n=NOTES[m];document.getElementById('note').innerHTML=`<span class="tag">${n[1]}</span><b>${n[0]}</b>${n[2]}`}
document.querySelectorAll('.bar button').forEach(x=>x.addEventListener('click',()=>setMode(+x.dataset.m)));setMode(mode);
function frame(now){const t=(now-t0)/1000;if(now-lastP>2500){tx=.78+.07*Math.sin(t*.35);ty=.5+.14*Math.sin(t*.27+1)}mx+=(tx-mx)*.06;my+=(ty-my)*.06;gl.uniform2f(uM,mx,my);gl.uniform1f(uT,t);gl.uniform1f(uMode,mode);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
